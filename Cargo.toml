[package]
name = "geometry_r"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "High-performance geodesy and spherical geometry on a round Earth: ECEF, look/scan angles, geodesics, beam footprints and antimeridian-safe GeoJSON polygon booleans."
license = "MIT"
repository = "https://github.com/Pierre-Penven/geometry-r"
readme = "README.md"
documentation = "https://docs.rs/geometry_r"
exclude = [".github/", "scripts/", "docs/", "Makefile", "CLAUDE.md", "rustfmt.toml"]
keywords = ["geodesy", "ecef", "satellite", "geojson", "polygon"]
categories = ["science::geo", "mathematics", "aerospace"]

[dependencies]
i_overlay = "4"
rayon = { version = "1.10", optional = true }
serde_json = "1.0"
thiserror = "2"

[features]
default = []
# Batch helpers that run on all cores via rayon.
parallel = ["dep:rayon"]

[package.metadata.docs.rs]
all-features = true

[dev-dependencies]
approx = "0.5.1"

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1

[profile.bench]
inherits = "release"
debug = true
